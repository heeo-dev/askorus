# The PC agent on macOS and Linux (#52). The agent is developed on Windows,
# where scripts/test-all.ps1 runs everything; this runs the Go tests on the
# two other systems, with the pretend AI programs the tests bring along,
# then the install script and the background commands (start, autostart,
# path) for real on the runner. No real AI and no secrets are used, and the
# agent runs without its Tailscale node (ASKORUS_TEST_NO_TAILNET): nothing
# signs in anywhere or talks to Tailscale's servers.
name: agent (macOS, Linux)

on:
  push:
    branches: [main]
    paths: ['agent/**', 'tsbridge/**', 'scripts/install.sh', 'scripts/test-install.sh', 'scripts/test-unix.sh', '.github/workflows/agent-unix.yml']
  pull_request:
    paths: ['agent/**', 'tsbridge/**', 'scripts/install.sh', 'scripts/test-install.sh', 'scripts/test-unix.sh', '.github/workflows/agent-unix.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-unix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS runs on the Intel runner. The Apple silicon one (macos-latest) was
        # not handed out in five runs on 2026-11-12: GitHub cancelled the job
        # after 15 minutes each time. Put it back here when it is.
        os: [ubuntu-latest, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agent
    steps:
      # Pinned to the commits of the releases, not to a tag that can move.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: vet
        run: go vet -tags ts_omit_peerapiserver,ts_omit_c2n,ts_omit_logtail ./...
      - name: test
        run: go test -tags ts_omit_peerapiserver,ts_omit_c2n,ts_omit_logtail ./...
      - name: build
        run: go build -trimpath -tags ts_omit_peerapiserver,ts_omit_c2n,ts_omit_logtail -o "${RUNNER_TEMP}/askorus-agent" ./cmd/askorus-agent
      - name: build for the other Mac and for Linux on ARM
        run: |
          GOOS=darwin GOARCH=arm64 go build -trimpath -tags ts_omit_peerapiserver,ts_omit_c2n,ts_omit_logtail -o "${RUNNER_TEMP}/a1" ./cmd/askorus-agent
          GOOS=darwin GOARCH=amd64 go build -trimpath -tags ts_omit_peerapiserver,ts_omit_c2n,ts_omit_logtail -o "${RUNNER_TEMP}/a2" ./cmd/askorus-agent
          GOOS=linux GOARCH=arm64 go build -trimpath -tags ts_omit_peerapiserver,ts_omit_c2n,ts_omit_logtail -o "${RUNNER_TEMP}/a3" ./cmd/askorus-agent
      # The app's Tailscale bridge (#57): vetted as the Android app builds it, and its tests.
      - name: tsbridge
        working-directory: tsbridge
        run: |
          go vet -tags ts_omit_peerapiserver,ts_omit_c2n,ts_omit_logtail ./...
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go vet -tags ts_omit_peerapiserver,ts_omit_c2n,ts_omit_logtail .
          go test -tags ts_omit_peerapiserver,ts_omit_c2n,ts_omit_logtail ./...
      - name: install script
        working-directory: .
        run: bash scripts/test-install.sh
      # start, status, shutdown, path and autostart as a person runs them; on
      # macOS the launch agent's file is loaded into launchd, on Linux the unit
      # goes to this user's systemd when the runner has one.
      - name: background commands on the real system
        working-directory: .
        env:
          ASKORUS_TEST_LAUNCHD: '1'
          ASKORUS_TEST_SYSTEMD: '1'
        run: bash scripts/test-unix.sh
