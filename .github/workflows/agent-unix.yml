# The PC agent's tests on macOS and Linux (#52). The agent is developed on
# Windows, where scripts/test-all.ps1 runs everything; this runs the Go
# tests on the two other systems, with the pretend AI programs the tests
# bring along. No real AI, no Tailscale and no secrets are used.
name: agent (macOS, Linux)

on:
  push:
    branches: [main]
    paths: ['agent/**', '.github/workflows/agent-unix.yml']
  pull_request:
    paths: ['agent/**', '.github/workflows/agent-unix.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-unix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS on both kinds of Mac. The Apple silicon runners are at times
        # not handed out for a long while (the job is then cancelled, not
        # failed); the Intel one usually still runs the macOS tests.
        os: [ubuntu-latest, macos-latest, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agent
    steps:
      # Pinned to the commits of the releases, not to a tag that can move.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: build
        run: go build -trimpath -o "${RUNNER_TEMP}/askorus-agent" ./cmd/askorus-agent
