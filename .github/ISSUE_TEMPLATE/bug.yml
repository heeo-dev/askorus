name: Bug report / 버그 신고
description: Something does not work as it should. 한국어로 써도 됩니다.
labels: ["버그"]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Take your account, PC name, addresses and folder paths out of what you paste, and never post a pairing link or code, or a Tailscale sign-in link. A security problem goes in private: see SECURITY.md.
        이슈는 공개됩니다. 붙여 넣는 글에서 계정, PC 이름, 주소, 폴더 경로는 지워 주세요. 짝 맺기 링크와 코드는 올리지 마세요. 보안 문제는 SECURITY.md의 방법으로 비공개로 알려 주세요.
  - type: textarea
    id: what
    attributes:
      label: What happened / 무슨 일이 있었나요
      description: What you did, what you expected, what happened instead. 무엇을 했고, 무엇을 기대했고, 대신 무슨 일이 일어났는지.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: The PC's system / PC의 운영체제
      options:
        - Windows
        - macOS (Apple silicon)
        - macOS (Intel)
        - Linux
        - Not about the PC / PC와 무관
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions / 판
      description: "`askorus-agent version` on the PC, and the app's version (Settings > About). PC에서 `askorus-agent version`, 앱은 설정 > 정보."
      placeholder: "agent 0.3.0, app 0.3.0"
  - type: textarea
    id: check
    attributes:
      label: Output of `askorus-agent check` / `askorus-agent check` 결과
      description: With your account and PC names taken out. 계정과 PC 이름은 지우고 붙여 주세요.
      render: text
  - type: textarea
    id: more
    attributes:
      label: Anything else / 그 밖에
      description: The phone and its Android version, which AI programs are installed, screenshots. 폰과 안드로이드 판, 설치한 AI 프로그램, 화면 사진.
