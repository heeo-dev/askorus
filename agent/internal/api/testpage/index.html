<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asksemble 시험 페이지</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1 class="brand" aria-label="Asksemble 시험 페이지"><svg class="mark" width="32" height="32" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><path d="M50 0C88 0 100 12 100 50S88 100 50 100S0 88 0 50S12 0 50 0Z" fill="#FFAD85"/><circle cx="50" cy="43.5" r="17" fill="#2A1408"/><circle cx="35" cy="51.5" r="16.5" fill="#2A1408" stroke="#FFAD85" stroke-width="3"/><circle cx="65" cy="51.5" r="16.5" fill="#2A1408" stroke="#FFAD85" stroke-width="3"/><path d="M28 59.5L27 73L40 65.5Z" fill="#2A1408"/></svg><span class="wordmark" lang="en"><span class="ask">Ask</span><span class="semble">semble</span></span> <span class="sub">시험 페이지</span></h1>
  <p class="note">앱이 나오기 전에 짝 맺기와 세션 목록을 폰 브라우저로 시험하는 페이지입니다. AI 회사의 공식 제품이 아닙니다.</p>

  <section id="pair">
    <h2>1. 짝 맺기</h2>
    <label>코드 <input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>
    <label>기기 이름 <input id="name" value="폰 브라우저 시험" maxlength="64"></label>
    <button id="pairBtn">짝 맺기</button>
    <p id="pairMsg" class="msg"></p>
  </section>

  <section id="use" hidden>
    <h2>2. 써 보기</h2>
    <p id="who" class="msg"></p>
    <div class="row">
      <button id="infoBtn">정보</button>
      <button id="listBtn">세션 목록</button>
      <button id="forgetBtn" class="secondary">토큰 지우기</button>
    </div>
    <div class="row">
      <select id="state">
        <option value="">모든 상태</option>
        <option value="running">실행 중</option>
        <option value="stopped">멈춤</option>
        <option value="terminal">터미널</option>
        <option value="history">기록만</option>
      </select>
      <input id="q" placeholder="검색">
    </div>
    <p id="useMsg" class="msg"></p>
    <div id="resumeLink"></div>
    <pre id="info" hidden></pre>
    <ul id="list"></ul>

    <h2>3. 새 세션</h2>
    <div class="row">
      <select id="folder"><option value="">폴더를 불러오세요</option></select>
      <button id="folderBtn" class="secondary">폴더 불러오기</button>
    </div>
    <label>이름 <input id="newName" maxlength="64" placeholder="비우면 폴더 이름과 시각"></label>
    <button id="newBtn">새 세션 시작</button>
    <p id="newMsg" class="msg"></p>
    <div id="newLink"></div>

    <h2>4. 폴더 열어 두기</h2>
    <p class="note">켜 두면 Claude 앱의 PC 목록에서 이 폴더를 골라 새 세션을 바로 만들 수 있습니다.</p>
    <button id="serveBtn" class="secondary">상태 새로 고침</button>
    <ul id="serveList"></ul>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
