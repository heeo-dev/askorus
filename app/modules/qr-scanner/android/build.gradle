plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.askorus'
version = '1.0.0'

android {
  namespace "app.askorus.qrscanner"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

// The pairing QR is read on the phone and nothing about it leaves the phone:
// CameraX shows the camera and hands over frames, ZXing (plain Java) reads
// the code. No ML Kit and no Google Play services, which send diagnostics
// and usage numbers to Google (#32).
dependencies {
  def camerax_version = '1.6.0'
  implementation "androidx.camera:camera-core:${camerax_version}"
  implementation "androidx.camera:camera-camera2:${camerax_version}"
  implementation "androidx.camera:camera-lifecycle:${camerax_version}"
  implementation "androidx.camera:camera-view:${camerax_version}"
  implementation 'androidx.core:core:1.17.0'
  implementation 'com.google.zxing:core:3.5.3'

  testImplementation 'junit:junit:4.13.2'
}
