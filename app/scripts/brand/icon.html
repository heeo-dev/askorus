<!doctype html>
<!--
  App icon I2-A, 'three voices' (docs/brand/icon/askorus-icon.svg, picked on
  11-08, #31): three ink #2A1408 circles that make a speech bubble, each with
  an open apricot mouth, on apricot #FFAD85. The apricot rings part the
  circles. scripts/render-brand.mjs fills {{px}}, {{viewBox}} and {{layers}}
  (which shapes to draw) for each PNG and screenshots the page.
-->
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; background: transparent; overflow: hidden; } svg { display: block; }</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="{{px}}" height="{{px}}" viewBox="{{viewBox}}">
<defs>
<path id="squircle" d="M50 0C88 0 100 12 100 50S88 100 50 100S0 88 0 50S12 0 50 0Z" fill="#FFAD85"></path>
<rect id="square" x="0" y="0" width="100" height="100" fill="#FFAD85"></rect>
<g id="mark"><circle cx="50" cy="40" r="17" fill="#2A1408"></circle><circle cx="36" cy="55" r="16" fill="#2A1408" stroke="#FFAD85" stroke-width="3"></circle><circle cx="64" cy="55" r="16" fill="#2A1408" stroke="#FFAD85" stroke-width="3"></circle><path d="M29 63L28 73L41 66Z" fill="#2A1408"></path><path d="M46 30.5H54Q54 37 50 37Q46 37 46 30.5ZM30.5 51.5H41.5Q41.5 61 36 61Q30.5 61 30.5 51.5ZM58.5 51.5H69.5Q69.5 61 64 61Q58.5 61 58.5 51.5Z" fill="#FFAD85"></path></g>
<!-- The same mark as one silhouette: white shows, black hides, so the
     apricot rings and the three mouths become cut-outs (themed icons). -->
<mask id="silhouette" maskUnits="userSpaceOnUse" x="-100" y="-100" width="300" height="300"><rect x="-100" y="-100" width="300" height="300" fill="#000000"></rect><circle cx="50" cy="40" r="17" fill="#FFFFFF"></circle><circle cx="36" cy="55" r="16" fill="#FFFFFF" stroke="#000000" stroke-width="3"></circle><circle cx="64" cy="55" r="16" fill="#FFFFFF" stroke="#000000" stroke-width="3"></circle><path d="M29 63L28 73L41 66Z" fill="#FFFFFF"></path><path d="M46 30.5H54Q54 37 50 37Q46 37 46 30.5ZM30.5 51.5H41.5Q41.5 61 36 61Q30.5 61 30.5 51.5ZM58.5 51.5H69.5Q69.5 61 64 61Q58.5 61 58.5 51.5Z" fill="#000000"></path></mask>
</defs>
{{layers}}
</svg>
</body>
</html>
