# E2E-05: keep rc-test open (the PC starts a folder server), then close it.
# Only a running server shows "Open · n/m sessions", so that text tells the
# state of rc-test apart from the other folders' "Off". Since S5c My PC
# leads to the folders screen by its "Keep folders open" row, and each
# folder is a switch row named "Keep <folder> open".
appId: host.exp.exponent
---
- runFlow: 01-home-and-list.yaml
- tapOn:
    text: "Keep folders open"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "Keep rc-test open"
    timeout: 10000
- extendedWaitUntil:
    visible: "Off|Open · .*"
    timeout: 10000
# Open it unless an earlier run left it open, then close it. A "when
# notVisible" check returns at once; "when visible" waits about 7 s when
# the text is absent, as it usually is.
- runFlow:
    when:
      notVisible: "Open · .*"
    commands:
      - tapOn:
          text: "Keep rc-test open"
          waitToSettleTimeoutMs: 300
      - extendedWaitUntil:
          visible: "Open · .*"
          timeout: 30000
- tapOn:
    text: "Keep rc-test open"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    notVisible: "Open · .*"
    timeout: 30000
