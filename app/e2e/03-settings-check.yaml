# E2E-06: the connection check in settings passes every step.
# Settings is opened by its link: in Expo Go a floating tools button sits
# over the header's "Settings" (the built app has no such button). The link
# does not reload the app, so the developer menu (closed by _open-app) does
# not come back.
appId: host.exp.exponent
---
- runFlow: _open-app.yaml
- openLink: exp://${MAESTRO_HOST}:8081/--/settings
- extendedWaitUntil:
    visible: "Check connection"
    timeout: 10000
- tapOn:
    text: "Check connection"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: ".*Reached the PC"
    timeout: 15000
- assertVisible: ".*The PC knows this phone"
- assertVisible: ".*Agent .*"
- assertVisible: ".*Claude Code .*"
- assertNotVisible: ".*out of date.*|.*administrator.*|.*turns Remote Control off.*"
