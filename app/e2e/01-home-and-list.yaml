# E2E-01: My PC shows the paired PC as connected, with its sessions.
# Since S5c the app opens on All at once; the header's switch leads to My
# PCs, which is the PC's session list itself.
# Taps wait only briefly for the screen to settle (waitToSettleTimeoutMs);
# the wait after each tap is what checks the next screen.
appId: host.exp.exponent
---
- runFlow: _open-app.yaml
- tapOn:
    text: "My PCs"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "Connected · agent .*"
    timeout: 10000
- extendedWaitUntil:
    visible: "New session"
    timeout: 10000
- assertVisible: "Sessions"
- assertVisible: "Search sessions"
# The row is under the last session. This PC has more sessions than a
# screen (11-03: test-live leaves live-* ones), so look under the short
# Running list, then go back to All.
- tapOn:
    text: "Running"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "Keep folders open"
    timeout: 10000
- tapOn:
    text: "All"
    waitToSettleTimeoutMs: 300
