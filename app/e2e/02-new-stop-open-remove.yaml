# E2E-02..04: start a session in rc-test, stop it, open it again, remove it.
# The real claude runs these; only the rc-test folder is used. Waits on
# claude are long; waits on the app and the agent are short. Since S5c the
# new session button is My PC's round "New session" button, and the session
# sheet holds Open in the Claude app, Stop and Remove.
appId: host.exp.exponent
# The session keeps the default name, "rc-test MM-DD HH:MM" (11-03): typing
# a name sends key events, which take Android out of touch mode, and React
# Native's text field is not focusable outside it, so the focus jumped to
# the top bar's button and the text went nowhere (on the S10; a finger on
# the keyboard is not affected). No other rc-test session may be named so.
env:
  NAME: rc-test \d\d-\d\d \d\d:\d\d
---
- runFlow: 01-home-and-list.yaml

# E2E-02 new session
- tapOn:
    text: "New session"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "rc-test"
    timeout: 10000
- tapOn:
    text: "rc-test"
    index: 0
    waitToSettleTimeoutMs: 300
- tapOn:
    text: "Start and open in the Claude app"
    waitToSettleTimeoutMs: 300
# The Claude link opens a browser (emulator) or the Claude app (test phone).
# Come back by the dev server link, which keeps the app's screen: back would
# stay in the Claude app, whose header also shows the session name.
- extendedWaitUntil:
    notVisible: "Starting a new session on the PC.*"
    timeout: 60000
- openLink: exp://${MAESTRO_HOST}:8081
- extendedWaitUntil:
    visible: "New session"
    timeout: 10000
- extendedWaitUntil:
    visible: ${NAME}
    timeout: 15000

# E2E-03 stop, then open again (must ask the PC, not reuse the old link)
- tapOn:
    text: ${NAME}
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "Stop"
    timeout: 10000
- tapOn:
    text: "Stop"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "Stopped. Opening it again resumes it."
    timeout: 15000
- assertNotVisible: "Open again"
- tapOn:
    text: "Open in the Claude app"
    waitToSettleTimeoutMs: 300
# Waking takes up to ~45 s ("Cancel" shows meanwhile); then the Claude link
# opens over the app. Come back the same way; the sheet is still open.
- extendedWaitUntil:
    notVisible: "Cancel"
    timeout: 60000
- openLink: exp://${MAESTRO_HOST}:8081
- extendedWaitUntil:
    visible: "Remove"
    timeout: 10000
- assertVisible: "Woke the stopped session."
- assertVisible: "Open again"
- pressKey: back

# E2E-04 remove
- extendedWaitUntil:
    visible: ${NAME}
    timeout: 10000
- tapOn:
    text: ${NAME}
    waitToSettleTimeoutMs: 300
- tapOn:
    text: "Remove"
    waitToSettleTimeoutMs: 300
# The confirm dialog repeats "Remove"; press the one under its message.
- extendedWaitUntil:
    visible: "Remove this session\\?"
    timeout: 10000
- tapOn:
    text: "(?i)remove"
    below: "If it is running it stops.*"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    notVisible: ${NAME}
    timeout: 15000
