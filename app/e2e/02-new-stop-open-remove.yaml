# E2E-02..04: start a session in rc-test, stop it, open it again, remove it.
# The real claude runs these; only the rc-test folder is used.
appId: host.exp.exponent
env:
  NAME: e2e-${new Date().getTime()}
---
- runFlow: 01-home-and-list.yaml

# E2E-02 new session
- tapOn: "\\+ New session"
- extendedWaitUntil:
    visible: "rc-test"
    timeout: 20000
- tapOn:
    text: "rc-test"
    index: 0
- tapOn: "Leave empty for the folder name and time"
- inputText: ${NAME}
- hideKeyboard
- tapOn: "Start and open in the Claude app"
# The Claude link opens a browser on the emulator; come back to the app.
- extendedWaitUntil:
    notVisible: "Starting a new session on the PC.*"
    timeout: 60000
- back
- extendedWaitUntil:
    visible: ${NAME}
    timeout: 30000

# E2E-03 stop, then open again (must ask the PC, not reuse the old link)
- tapOn: ${NAME}
- extendedWaitUntil:
    visible: "Stop"
    timeout: 10000
- tapOn: "Stop"
- extendedWaitUntil:
    visible: "Stopped. Opening it again resumes it."
    timeout: 30000
- assertNotVisible: "Open again"
- tapOn: "Open in the Claude app"
# Waking takes up to ~45 s ("Cancel" shows meanwhile); then the Claude link
# opens a browser over the app. Come back until the sheet shows again.
- extendedWaitUntil:
    notVisible: "Cancel"
    timeout: 90000
- repeat:
    times: 3
    while:
      notVisible: "Remove"
    commands:
      - pressKey: back
      - waitForAnimationToEnd
- assertVisible: "Woke the stopped session."
- assertVisible: "Open again"
- pressKey: back

# E2E-04 remove
- extendedWaitUntil:
    visible: ${NAME}
    timeout: 20000
- tapOn: ${NAME}
- tapOn: "Remove"
- tapOn:
    text: "REMOVE"
    optional: true
- tapOn:
    text: "Remove"
    index: 1
    optional: true
- extendedWaitUntil:
    notVisible: ${NAME}
    timeout: 30000
