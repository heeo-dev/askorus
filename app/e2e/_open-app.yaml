# Opens the app from the dev server in Expo Go on its home screen (All at
# once since S5c; "My PCs" is the other half of its header switch, so it
# shows on both entrances). The home link (with a query, or Expo Go treats
# it as the plain link and keeps the screen the last flow left) starts the
# app or brings a running one home.
# Expo Go shows its developer menu on the first open; it is closed here.
appId: host.exp.exponent
---
- openLink: exp://${MAESTRO_HOST}:8081/--/?home=1
# The first bundle of a new worktree takes about 30 s to build.
- extendedWaitUntil:
    visible: "My PCs|Go home|Continue"
    timeout: 60000
# On the emulator the developer menu can rise a moment after the app shows.
# It has not shown on the test phone, and a "when visible" check for
# something absent waits about 7 s, so the phone skips it.
- runFlow:
    when:
      true: ${MAESTRO_DEVICE == 'emulator'}
    commands:
      - extendedWaitUntil:
          visible: "Continue|Go home"
          timeout: 3000
          optional: true
      - runFlow:
          when:
            visible: "Continue"
          commands:
            - tapOn: "Continue"
      - runFlow:
          when:
            visible: "Go home"
          commands:
            - pressKey: back
- extendedWaitUntil:
    visible: "My PCs"
    timeout: 10000
