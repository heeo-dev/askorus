# Opens the app from the dev server in Expo Go and waits for the home screen.
# Expo Go shows its developer menu on the first open; it is closed here.
# Opening the same link again keeps the screen the last flow left, so go
# back until the home screen shows.
appId: host.exp.exponent
---
- openLink: exp://10.0.2.2:8081
# Text from one of our screens (or the developer menu over it): the bundle
# has loaded. Expo Go's own loading screen must not count, or the back
# presses below would close Expo Go.
- extendedWaitUntil:
    visible: "My PCs|Go home|Continue|\\+ New session|Folders|Pair with a PC|Remove|Open again|Check connection|Is this your PC\\?"
    timeout: 120000
- waitForAnimationToEnd
# The developer menu can rise a few seconds after the app shows.
- extendedWaitUntil:
    visible: "Continue|Go home"
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Go home"
    commands:
      - pressKey: back
      - waitForAnimationToEnd
- repeat:
    times: 5
    while:
      notVisible: "My PCs"
    commands:
      - pressKey: back
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "My PCs"
    timeout: 30000
